name: Sync BookOrbit KOReader Plugin

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out distribution repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest published BookOrbit release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api repos/bookorbit/bookorbit/releases/latest --jq '.tag_name')
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using BookOrbit release ${tag}."

      - name: Check out BookOrbit release
        uses: actions/checkout@v4
        with:
          repository: bookorbit/bookorbit
          ref: ${{ steps.release.outputs.tag }}
          path: upstream
          fetch-depth: 0

      - name: Read released plugin version
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^local PLUGIN_VERSION = "\([^"]*\)"/\1/p' upstream/koreader-plugin/bookorbit.koplugin/main.lua)
          test -n "$version"
          sha=$(git -C upstream rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Detect released plugin changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if diff -qr upstream/koreader-plugin/bookorbit.koplugin bookorbit.koplugin > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "BookOrbit ${{ steps.release.outputs.tag }} contains no plugin changes to distribute."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "BookOrbit ${{ steps.release.outputs.tag }} contains plugin changes."
          fi

      - name: Verify plugin version is publishable
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.upstream.outputs.version }}"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "Released BookOrbit plugin changed, but plugin version v${version} already exists in this distribution repository. Bump PLUGIN_VERSION in bookorbit/bookorbit before the next BookOrbit release." >&2
            exit 1
          fi

      - name: Run upstream KOReader Lua test suite
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          cd upstream
          find koreader-plugin/spec -maxdepth 1 -name '*_test.lua' -print0 | sort -z | xargs -0 -n1 /usr/bin/lua5.1

      - name: Synchronize released plugin source
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bookorbit.koplugin
          cp -a upstream/koreader-plugin/bookorbit.koplugin ./bookorbit.koplugin

      - name: Validate generic distribution
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f bookorbit.koplugin/_meta.lua
          test -f bookorbit.koplugin/main.lua
          test ! -e bookorbit.koplugin/bookorbit_config.lua
          test ! -e bookorbit.koplugin/credentials.lua

      - name: Build plugin archive
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          zip -qr bookorbit.koplugin.zip bookorbit.koplugin

      - name: Commit synchronized source
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bookorbit.koplugin
          git commit -m "chore: sync BookOrbit KOReader plugin v${{ steps.upstream.outputs.version }} from ${{ steps.release.outputs.tag }}"
          git push origin HEAD

      - name: Create GitHub release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.upstream.outputs.version }}"
          upstream_tag="${{ steps.release.outputs.tag }}"
          sha="${{ steps.upstream.outputs.sha }}"
          git tag "v${version}"
          git push origin "v${version}"
          gh release create "v${version}" bookorbit.koplugin.zip \
            --title "BookOrbit KOReader Plugin v${version}" \
            --notes "Automated distribution of the BookOrbit KOReader plugin from BookOrbit release ${upstream_tag} (${sha})."
